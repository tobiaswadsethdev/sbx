name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The suite is hermetic: no gateway, no Docker, no network. The tests that
      # need a live gateway are #[ignore]d and are not run here.
      - name: Tests
        run: cargo test --workspace

      # The desktop application's types are generated from the Rust ones. A
      # checked-in binding that no longer matches its type is a shape mismatch
      # discovered at runtime in a webview, so it is a build failure here.
      - name: TypeScript bindings are current
        run: |
          ./scripts/gen-bindings.sh
          git diff --exit-code -- apps/desktop/src/gen \
            || { echo "::error::bindings are stale; run ./scripts/gen-bindings.sh"; exit 1; }

      # The desktop application is not a workspace member -- building it needs a
      # GUI toolkit -- so what CI checks is the half that does not: the types it
      # is generated from, and that its own TypeScript agrees with them.
      - name: Desktop types
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop exec -- tsc --noEmit

      - name: Build
        run: cargo build --workspace --release

  # The client half has to compile for Windows, because the desktop application
  # runs there and `sbx-core` is underneath it. Only the client half: there is no
  # gateway, no Docker daemon and no tmux on that side, so `sbx` and `sbxd`
  # remain Linux programs and are not built here.
  #
  # A check rather than a build, and only these three crates, because what it is
  # guarding against is one `use std::os::unix::fs` -- which costs seconds to
  # catch here and a tagged release to catch anywhere else.
  windows:
    name: the client half compiles on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check -p sbx-client -p sbx-proto -p sbx-core --all-targets
