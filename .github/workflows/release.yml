name: Release

# Tag a version and this publishes the binary `install.sh` and `sbxd update`
# download, plus the Windows desktop installer.
#
# The tag is normally not made by hand: `tag.yml` bumps the seven files that
# carry the version, tags the commit that holds them, and dispatches this. Doing
# it the short way still works --
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# -- but then remember the bump, because nothing here checks that the tag and
# the tree agree, and once they did not.
#
# The asset names are part of the contract with both installers, and a test in
# `crates/sbx-core/src/update.rs` fails if the three ever disagree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # One resolved tag for both triggers. `github.ref_name` is the tag on a tag
  # push and the *branch* on a workflow_dispatch, which would name every asset
  # `sbx-main-...` and produce a release neither install.sh nor `sbx update`
  # can find.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # An architecture whose runner is unavailable must not take the other one
    # down with it: a release with one binary in it beats a release with none.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      # The tag, explicitly, and not whatever ref the run was started from. On
      # a tag push those are the same thing; on a `workflow_dispatch` they are
      # not -- the dispatch carries a branch, so this used to build `main` and
      # label the result with a tag it had never been at. Naming the tag also
      # means a dispatch for a tag that does not exist fails here, loudly,
      # instead of publishing whatever `main` happened to be.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # A dispatch takes the tag as free text, and a junk one would be baked
      # into an asset name and a git tag that outlives the mistake.
      - name: Check the tag looks like a version
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "building $TAG" ;;
            *) echo "TAG=$TAG is not a vX.Y.Z tag"; exit 1 ;;
          esac

      # musl, so one binary runs on every distribution rather than on the ones
      # whose glibc is new enough. The dependency tree is pure Rust, so this
      # needs nothing but the linker.
      - name: Install Rust and musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The whole Linux side, in one binary. `sbx` was a second one until
      # v0.4.0, when it folded into this: two front ends onto one set of
      # sessions cost more than the terminal one was worth.
      - name: Build
        run: cargo build --release --locked --bin sbxd --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release"
          # Ask it what it is. A binary built from the wrong commit answers the
          # wrong version, and that is cheaper to find out here than in
          # `sbxd update`, which refuses the swap over exactly this.
          "$bin/sbxd" --version
          # Flat, one file at the root of the archive: install.sh and
          # `sbxd update` both expect to find `sbxd` and nothing else.
          #
          # The asset is named after what it holds, so it changed name in
          # v0.4.0 along with the binary. Nothing older can follow that -- an
          # `sbx update` replaces the binary it is running and there is no
          # longer an `sbx` to replace it with -- so it fails saying this
          # release has no `sbx-...tar.gz`, which is true. v0.3.1 is the last
          # release `sbx update` can reach at all, which is what keeps anyone
          # from being stranded on v0.3.0 -- but it is not a bridge across this
          # rename, because the `sbxd` it installs is the server alone and has
          # no `update` of its own. One `install.sh`, and never again.
          tar -czf "sbxd-${TAG}-${{ matrix.target }}.tar.gz" -C "$bin" sbxd
          sha256sum "sbxd-${TAG}-${{ matrix.target }}.tar.gz" > "${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: sbxd-${{ matrix.target }}
          path: |
            sbxd-${{ env.TAG }}-${{ matrix.target }}.tar.gz
            ${{ matrix.target }}.sha256
          if-no-files-found: error

  # The desktop application for Windows, which is the one platform where there
  # is nothing else to install: `sbxd` needs a gateway, a Docker daemon and
  # tmux, so the Windows side is the window and nothing but the window. It
  # pairs with a server from its own connect dialog rather than from a CLI --
  # see docs/desktop.md -- which is what makes an installer on its own useful.
  #
  # Linux is deliberately not built here. A Tauri bundle links against the
  # webkit2gtk of the distribution that built it, so one .deb or AppImage would
  # be a promise about GTK versions this cannot keep; there, it is built from the
  # tree. See docs/install.md.
  desktop:
    name: desktop (windows)
    runs-on: windows-latest
    # Whether there is a certificate to sign with, decided once here because
    # the `secrets` context is not in scope for a step's `if` -- see the import
    # step below. Job-level `env` is, and it may read `secrets`.
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      # And whether there is an *updater* key, which is a different key for a
      # different job: the certificate above is what stops SmartScreen warning
      # about the installer, this is what the installed window checks before it
      # will replace itself. Same reasoning for making it conditional -- and one
      # extra reason, which is that `createUpdaterArtifacts` makes `tauri build`
      # *fail* without a key rather than skip the signing. A fork would not be
      # able to cut a release at all.
      #
      # Both halves, because the key is password-protected and half a pair is a
      # state you can reach by running one `gh secret set` and being
      # interrupted. Checking only the key would take that half-configured
      # repository and turn it into a build that fails while trying to sign,
      # rather than a build that quietly skips signing.
      HAS_UPDATER_KEY: >-
        ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != ''
            && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      # The tag, explicitly, and not whatever ref the run was started from. On
      # a tag push those are the same thing; on a `workflow_dispatch` they are
      # not -- the dispatch carries a branch, so this used to build `main` and
      # label the result with a tag it had never been at. Naming the tag also
      # means a dispatch for a tag that does not exist fails here, loudly,
      # instead of publishing whatever `main` happened to be.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag looks like a version
        shell: bash
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "building $TAG" ;;
            *) echo "TAG=$TAG is not a vX.Y.Z tag"; exit 1 ;;
          esac

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: desktop-windows

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The version in the bundle is the one Windows shows in Add or Remove
      # Programs and the one an upgrade compares against, so it has to be the
      # tag rather than whatever the file said when it was last edited.
      - name: Take the version from the tag
        shell: bash
        run: |
          set -eu
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "${TAG#v}" '.version = $v' "$conf" > "$conf.new"
          mv "$conf.new" "$conf"
          jq -r .version "$conf"

      # Signing, when there is a certificate to sign with.
      #
      # An unsigned installer is not broken -- the checksums below are the
      # integrity story and they are the one that does not expire -- but
      # SmartScreen puts a full-width warning in front of it, and "more info ->
      # run anyway" is a bad first impression for a tool whose whole pitch is
      # isolation.
      #
      # Conditional on the secret rather than required, so a fork and a
      # maintainer without a certificate can both still cut a release. The
      # thumbprint is read back from the imported certificate rather than
      # configured, because a thumbprint in a config file and a certificate in a
      # secret are two things to keep in step and only one of them is visible.
      #
      # Never verified against a real certificate at the time of writing: there
      # was none to test with. What is verified is the unsigned path, which is
      # every release so far.
      #
      # The condition reads the job-level `env` above and not `secrets`
      # directly: `secrets` is not an available context for a step's `if`, and
      # naming it there is not a false condition but an invalid workflow --
      # every job in the file, tarballs included, refuses to start. A step's
      # *own* `env` is no good either, since that is not in scope for its `if`.
      - name: Import the signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        id: cert
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = [System.IO.Path]::GetTempFileName() + '.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $password = ConvertTo-SecureString -String $env:SIGNING_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($imported.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: bash
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          # Read by `tauri build` itself to sign the updater manifest. Empty
          # when there is no key, which is what the override below is for.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          npm --prefix apps/desktop ci

          # Built up as one `--config` object because `tauri build` takes one.
          # `jq -n` rather than string concatenation: this ends up as JSON on a
          # command line inside a shell inside YAML, and hand-quoting it is how
          # the last three bugs in this file happened.
          overrides='{}'
          if [ -n "${THUMBPRINT:-}" ]; then
            # A timestamp is what keeps a signature valid after the certificate
            # expires; without one the installer stops verifying the day the
            # certificate does.
            overrides=$(jq -n --arg t "$THUMBPRINT" \
              '{bundle:{windows:{certificateThumbprint:$t,digestAlgorithm:"sha256",timestampUrl:"http://timestamp.digicert.com"}}}')
          else
            echo "no signing certificate; building unsigned"
          fi
          if [ "${HAS_UPDATER_KEY}" != "true" ]; then
            # No key, so no signed manifest -- and `createUpdaterArtifacts` is
            # turned back off rather than left to fail the build. The installer
            # still works; it just will not offer to update itself.
            echo "no updater key; building without updater artifacts"
            overrides=$(printf '%s' "$overrides" | jq '.bundle.createUpdaterArtifacts = false')
          fi
          echo "$overrides"
          npm --prefix apps/desktop run tauri -- build --config "$overrides"

      # Renamed to carry the tag and the target, like the tarballs, and
      # checksummed into the same SHA256SUMS -- an installer downloaded from a
      # release page deserves the same verification as a binary.
      - name: Package
        shell: bash
        run: |
          set -eu
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir -p dist
          for msi in "$bundle"/msi/*.msi; do
            cp "$msi" "dist/sbx-desktop-${TAG}-x86_64-pc-windows-msvc.msi"
          done
          for exe in "$bundle"/nsis/*-setup.exe; do
            cp "$exe" "dist/sbx-desktop-${TAG}-x86_64-pc-windows-msvc-setup.exe"
          done
          cd dist
          sha256sum *.msi *.exe > desktop-windows.sha256
          cat desktop-windows.sha256

      # The manifest the installed window reads to find out it is behind.
      #
      # `latest.json` and not a name with the tag in it: the updater is
      # configured with one fixed URL --
      # `/releases/latest/download/latest.json` -- so the file has to be called
      # the same thing in every release for that URL to keep resolving. It is
      # the one asset here whose name is deliberately not versioned.
      #
      # The signature covers the installer's *bytes*, so renaming the file
      # below does not invalidate it. The `url` therefore points at the renamed
      # asset, which is where it actually ends up.
      - name: Write the update manifest
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          set -eu
          bundle=apps/desktop/src-tauri/target/release/bundle
          # Discovered rather than spelled out: the bundle carries the version
          # in its filename, and a pattern that has to be kept in step with
          # `tauri.conf.json` is a pattern that will not be.
          sig=$(ls "$bundle"/nsis/*-setup.exe.sig)
          asset="sbx-desktop-${TAG}-x86_64-pc-windows-msvc-setup.exe"
          jq -n \
            --arg version "${TAG#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$sig")" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/${asset}" \
            '{version: $version,
              pub_date: $pub_date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > dist/latest.json
          # Without the signature, which is long and is not the interesting
          # part of a log line.
          jq 'del(.platforms."windows-x86_64".signature)' dist/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbx-desktop-windows
          path: |
            dist/sbx-desktop-${{ env.TAG }}-x86_64-pc-windows-msvc.msi
            dist/sbx-desktop-${{ env.TAG }}-x86_64-pc-windows-msvc-setup.exe
            dist/desktop-windows.sha256
            dist/latest.json
          # `warn` and not `error`, because `latest.json` is written only when
          # there is an updater key and the other three are not conditional on
          # anything. A missing manifest is a release without self-update, not
          # a broken release.
          if-no-files-found: warn

  publish:
    name: Publish the release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # One SHA256SUMS covering every architecture, which is what install.sh
      # verifies against with --ignore-missing and what `sbx update` reads the
      # single line it needs out of.
      - name: Collect checksums
        run: |
          set -eu
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS

      # `fail_on_unmatched_files` below is worth keeping, so the list it is
      # checking has to be the list that actually exists. `latest.json` is the
      # one conditional asset -- there is no manifest without an updater key --
      # and naming it unconditionally would turn "this fork has no key" into a
      # failed release rather than a release without self-update.
      - name: What to publish
        id: files
        run: |
          set -eu
          {
            echo "list<<MANIFEST"
            echo "dist/*.tar.gz"
            echo "dist/*.msi"
            echo "dist/*.exe"
            echo "dist/SHA256SUMS"
            # `|| true` because `set -e` would take the false branch of a `&&`
            # as a failed step, which is a very silly way to lose a release.
            [ -f dist/latest.json ] && echo "dist/latest.json" || true
            echo "MANIFEST"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.files.outputs.list }}
