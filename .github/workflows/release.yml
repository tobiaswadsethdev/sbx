name: Release

# Tag a version and this publishes the binaries `install.sh` and `sbx update`
# download:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The asset names are part of the contract with both of them, and a test in
# `crates/sbx-core/src/update.rs` fails if the three ever disagree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # One resolved tag for both triggers. `github.ref_name` is the tag on a tag
  # push and the *branch* on a workflow_dispatch, which would name every asset
  # `sbx-main-...` and produce a release neither install.sh nor `sbx update`
  # can find.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # An architecture whose runner is unavailable must not take the other one
    # down with it: a release with one binary in it beats a release with none.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # A dispatch takes the tag as free text, and a junk one would be baked
      # into an asset name and a git tag that outlives the mistake.
      - name: Check the tag looks like a version
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "building $TAG" ;;
            *) echo "TAG=$TAG is not a vX.Y.Z tag"; exit 1 ;;
          esac

      # musl, so one binary runs on every distribution rather than on the ones
      # whose glibc is new enough. The dependency tree is pure Rust, so this
      # needs nothing but the linker.
      - name: Install Rust and musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin sbx --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/sbx"
          "$bin" --version
          # Flat, one file at the root of the archive: install.sh and
          # `sbx update` both expect to find `sbx` and nothing else.
          tar -czf "sbx-${TAG}-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" sbx
          sha256sum "sbx-${TAG}-${{ matrix.target }}.tar.gz" > "${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: sbx-${{ matrix.target }}
          path: |
            sbx-${{ env.TAG }}-${{ matrix.target }}.tar.gz
            ${{ matrix.target }}.sha256
          if-no-files-found: error

  # The desktop application for Windows, which is the one platform where there
  # is nothing else to install: `sbx` and `sbxd` need a gateway, a Docker daemon
  # and tmux, so the Windows side is the window and nothing but the window. It
  # pairs with a server from its own connect dialog rather than from a CLI --
  # see docs/desktop.md -- which is what makes an installer on its own useful.
  #
  # Linux is deliberately not built here. A Tauri bundle links against the
  # webkit2gtk of the distribution that built it, so one .deb or AppImage would
  # be a promise about GTK versions this cannot keep; there, it is built from the
  # tree. See docs/install.md.
  desktop:
    name: desktop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag looks like a version
        shell: bash
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "building $TAG" ;;
            *) echo "TAG=$TAG is not a vX.Y.Z tag"; exit 1 ;;
          esac

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: desktop-windows

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The version in the bundle is the one Windows shows in Add or Remove
      # Programs and the one an upgrade compares against, so it has to be the
      # tag rather than whatever the file said when it was last edited.
      - name: Take the version from the tag
        shell: bash
        run: |
          set -eu
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "${TAG#v}" '.version = $v' "$conf" > "$conf.new"
          mv "$conf.new" "$conf"
          jq -r .version "$conf"

      # Signing, when there is a certificate to sign with.
      #
      # An unsigned installer is not broken -- the checksums below are the
      # integrity story and they are the one that does not expire -- but
      # SmartScreen puts a full-width warning in front of it, and "more info ->
      # run anyway" is a bad first impression for a tool whose whole pitch is
      # isolation.
      #
      # Conditional on the secret rather than required, so a fork and a
      # maintainer without a certificate can both still cut a release. The
      # thumbprint is read back from the imported certificate rather than
      # configured, because a thumbprint in a config file and a certificate in a
      # secret are two things to keep in step and only one of them is visible.
      #
      # Never verified against a real certificate at the time of writing: there
      # was none to test with. What is verified is the unsigned path, which is
      # every release so far.
      # `secrets` and not a step-level `env`: a step's own `env` is not in scope
      # for its `if`, so that reads as empty and the step never runs.
      - name: Import the signing certificate
        if: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        id: cert
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = [System.IO.Path]::GetTempFileName() + '.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $password = ConvertTo-SecureString -String $env:SIGNING_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($imported.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: bash
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          set -eu
          npm --prefix apps/desktop ci
          if [ -n "${THUMBPRINT:-}" ]; then
            # A timestamp is what keeps a signature valid after the
            # certificate expires; without one the installer stops verifying
            # the day the certificate does.
            npm --prefix apps/desktop run tauri -- build --config \
              "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}"
          else
            echo "no signing certificate; building unsigned"
            npm --prefix apps/desktop run tauri -- build
          fi

      # Renamed to carry the tag and the target, like the tarballs, and
      # checksummed into the same SHA256SUMS -- an installer downloaded from a
      # release page deserves the same verification as a binary.
      - name: Package
        shell: bash
        run: |
          set -eu
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir -p dist
          for msi in "$bundle"/msi/*.msi; do
            cp "$msi" "dist/sbx-desktop-${TAG}-x86_64-pc-windows-msvc.msi"
          done
          for exe in "$bundle"/nsis/*-setup.exe; do
            cp "$exe" "dist/sbx-desktop-${TAG}-x86_64-pc-windows-msvc-setup.exe"
          done
          cd dist
          sha256sum *.msi *.exe > desktop-windows.sha256
          cat desktop-windows.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sbx-desktop-windows
          path: |
            dist/sbx-desktop-${{ env.TAG }}-x86_64-pc-windows-msvc.msi
            dist/sbx-desktop-${{ env.TAG }}-x86_64-pc-windows-msvc-setup.exe
            dist/desktop-windows.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One SHA256SUMS covering every architecture, which is what install.sh
      # verifies against with --ignore-missing and what `sbx update` reads the
      # single line it needs out of.
      - name: Collect checksums
        run: |
          set -eu
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.msi
            dist/*.exe
            dist/SHA256SUMS
