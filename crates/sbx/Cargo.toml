[package]
name = "sbx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Run several coding agents in parallel, each in its own OpenShell sandbox"

[[bin]]
name = "sbx"
path = "src/main.rs"

[dependencies]
sbx-core = { path = "../sbx-core" }
openshell-client = { path = "../openshell-client" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30.2"

[dev-dependencies]
serde_json.workspace = true
