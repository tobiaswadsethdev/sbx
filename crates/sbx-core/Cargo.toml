[package]
name = "sbx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The headless half of sbx: sessions, policy, and everything that is not a renderer"

[dependencies]
openshell-client = { path = "../openshell-client" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
ts-rs = { version = "12", optional = true }

[features]
# TypeScript for the desktop application, generated from these very types so
# there is never a second hand-maintained copy of them. Off by default: it is a
# build-time concern of one consumer, and no shipped binary needs it.
ts = ["dep:ts-rs"]
