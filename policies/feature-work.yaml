# feature-work: clone + agent + push, nothing else.
#
# Derived from OpenShell-Community sandboxes/base/policy.yaml.
# Network is per-binary: git may reach github.com for git protocol only,
# claude may reach the Anthropic API only. Nothing else has egress at all.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    # Pseudo-terminals, needed to run the agent under an in-sandbox tmux.
    # Landlock governs /dev too: without this, openpty reports "out of pty
    # devices" and tmux dies with "create window failed: fork failed", even
    # though /dev/pts/ptmx is mode crw-rw-rw-.
    #
    # Grant the directory only. Adding /dev/ptmx as well makes the supervisor
    # crash-loop at startup -- it is a symlink to pts/ptmx, and granting the
    # directory already covers the real device.
    - /dev/pts

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # Every endpoint here is credentialed by the claude-oauth provider, and the
  # gateway refuses to inject a credential into a connection it can only see at
  # L4 -- so all of these must be L7-inspectable. That needs no `tls:` key:
  # termination is automatic as of 0.0.110, and the explicit `tls: terminate`
  # this file used to carry is deprecated (`tls: skip` opts out). The community
  # base policy lists statsig.anthropic.com and sentry.io as bare host/port
  # telemetry; they are dropped rather than inspected, since denying agent
  # telemetry is a feature here.
  claude_code:
    name: claude-code
    endpoints:
      - { host: api.anthropic.com, port: 443, protocol: rest, enforcement: enforce, access: full }
      - { host: platform.claude.com, port: 443, protocol: rest, enforcement: enforce, access: full }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }

  # git over Smart HTTP, read AND write (push enabled -- this is the
  # difference from the community base policy, which comments push out).
  github_git:
    name: github-git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**/info/refs*" }
          - allow: { method: POST, path: "/**/git-upload-pack" }
          - allow: { method: POST, path: "/**/git-receive-pack" }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }
      - { path: /usr/lib/git-core/git-remote-https }

  # Azure DevOps. One host does both jobs, unlike GitHub: dev.azure.com serves
  # the git smart-HTTP endpoints (/{org}/{project}/_git/{repo}/...) and the REST
  # API (/{org}/{project}/_apis/...), where GitHub splits those across
  # github.com and api.github.com. So one endpoint, with rules covering both.
  #
  # The paths are the same shapes as GitHub's despite the extra project level,
  # because the patterns are anchored on the tail: verified against
  # /inetse/inet/_git/Inet.DotFiles/info/refs.
  #
  # curl is a binary here because a pull request is created with a plain REST
  # POST. The alternative is the Azure CLI plus its devops extension -- a Python
  # runtime added to the image for one call -- and there is no `gh` equivalent.
  azure_git:
    name: azure-git
    endpoints:
      - host: dev.azure.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**/info/refs*" }
          - allow: { method: POST, path: "/**/git-upload-pack" }
          - allow: { method: POST, path: "/**/git-receive-pack" }
          - allow: { method: GET,  path: "/**/_apis/**" }
          - allow: { method: POST, path: "/**/_apis/**" }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }
      - { path: /usr/lib/git-core/git-remote-https }
      - { path: /usr/bin/curl }

  github_rest_api:
    name: github-rest-api
    endpoints:
      - { host: api.github.com, port: 443, protocol: rest, enforcement: enforce, access: read-write }
    binaries:
      - { path: /usr/bin/gh }
